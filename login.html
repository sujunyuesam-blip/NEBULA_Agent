<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Nebula AI Incubator - Login">
<meta name="theme-color" content="#000000">
<title>Login - Nebula AI Agent</title>
<style>
:root {
    --mac-bg: #000000;
    --mac-bg-secondary: #1c1c1e;
    --mac-bg-tertiary: #2c2c2e;
    --mac-accent: #0a84ff;
    --mac-accent-dark: #0071e3;
    --mac-text: #ffffff;
    --mac-text-secondary: #98989d;
    --mac-border: rgba(255, 255, 255, 0.12);
    --mac-danger: #ff453a;
    --glass-blur: blur(25px) saturate(160%);
    --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
    --radius-lg: 18px;
    --radius-md: 12px;
    --font-primary: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: var(--font-primary);
    background: var(--mac-bg);
    color: var(--mac-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Animated background */
.background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
}

.background::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(10, 132, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(94, 92, 230, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(48, 209, 88, 0.05) 0%, transparent 60%);
    animation: backgroundPulse 15s ease-in-out infinite;
}

@keyframes backgroundPulse {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(-2%, -2%) scale(1.02); }
    50% { transform: translate(2%, 2%) scale(1); }
    75% { transform: translate(-1%, 1%) scale(1.01); }
}

.login-container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.login-card {
    background: rgba(28, 28, 30, 0.85);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--mac-border);
    border-radius: var(--radius-lg);
    padding: 48px 40px;
    box-shadow: var(--shadow-lg);
}

.logo {
    text-align: center;
    margin-bottom: 32px;
}

.logo-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--mac-accent) 0%, #5e5ce6 100%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 8px 32px rgba(10, 132, 255, 0.3);
}

.logo h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
}

.logo p {
    color: var(--mac-text-secondary);
    font-size: 14px;
}

.form-group {
    margin-bottom: 24px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--mac-text-secondary);
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 14px 16px;
    background: var(--mac-bg-tertiary);
    border: 1px solid var(--mac-border);
    border-radius: var(--radius-md);
    color: var(--mac-text);
    font-size: 16px;
    font-family: inherit;
    transition: all 0.2s ease;
}

.form-group input:focus {
    outline: none;
    border-color: var(--mac-accent);
    box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.2);
}

.form-group input::placeholder {
    color: var(--mac-text-secondary);
    opacity: 0.6;
}

.error-message {
    color: var(--mac-danger);
    font-size: 13px;
    margin-top: 8px;
    display: none;
    align-items: center;
    gap: 6px;
}

.error-message.visible {
    display: flex;
}

.login-btn {
    width: 100%;
    padding: 14px 24px;
    background: linear-gradient(135deg, var(--mac-accent) 0%, var(--mac-accent-dark) 100%);
    border: none;
    border-radius: var(--radius-md);
    color: white;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px rgba(10, 132, 255, 0.3);
}

.login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(10, 132, 255, 0.4);
}

.login-btn:active {
    transform: translateY(0);
}

.login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.shake {
    animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

@keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
}

@media (max-width: 480px) {
    .login-card {
        padding: 32px 24px;
    }

    .logo-icon {
        width: 64px;
        height: 64px;
        font-size: 28px;
    }

    .logo h1 {
        font-size: 20px;
    }
}
</style>
</head>
<body>
<div class="background"></div>

<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">N</div>
            <h1>Nebula AI Agent</h1>
            <p>Enterprise Edition</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                <div class="error-message" id="errorMessage">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>Incorrect password. Please try again.</span>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>
    </div>
</div>

<script>
(function() {
    // Check if already authenticated
    if (sessionStorage.getItem('nebula_authenticated') === 'true') {
        window.location.href = 'index.html';
        return;
    }

    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('errorMessage');
    const loginBtn = document.getElementById('loginBtn');
    const loginCard = document.querySelector('.login-card');

    // Hash function for password verification
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Pre-computed hash of the correct password
    const correctPasswordHash = '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08';

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const password = passwordInput.value;

        if (!password) {
            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Verifying...';

        try {
            const inputHash = await hashPassword(password);

            if (inputHash === correctPasswordHash) {
                // Success - store authentication and redirect
                sessionStorage.setItem('nebula_authenticated', 'true');
                loginBtn.textContent = 'Success!';
                loginBtn.style.background = 'linear-gradient(135deg, #30d158 0%, #248a3d 100%)';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            } else {
                // Failure - show error
                errorMessage.classList.add('visible');
                loginCard.classList.add('shake');
                passwordInput.value = '';
                passwordInput.focus();

                setTimeout(() => {
                    loginCard.classList.remove('shake');
                }, 500);

                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        } catch (error) {
            console.error('Authentication error:', error);
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        }
    });

    // Hide error message when user starts typing
    passwordInput.addEventListener('input', function() {
        errorMessage.classList.remove('visible');
    });

    // Focus password input on load
    passwordInput.focus();
})();
</script>
</body>
</html>
